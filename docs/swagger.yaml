basePath: /api/v1
definitions:
  domain.ActivityEvent:
    properties:
      actor_id:
        type: integer
      actor_name:
        type: string
      amount:
        description: cents — 0 for comments
        type: integer
      category:
        description: |-
          Category is the expense's category slug (empty for settlements and
          comments) so the feed can show the same icon the group history and
          detail views do.
        type: string
      currency:
        type: string
      date:
        type: string
      deleted:
        description: |-
          Deleted (expenses only — a settlement can't be soft-deleted) means this
          is a tombstone: still shown for transparency, but crossed out and
          non-interactive in the feed, same as in the group's own history.
        type: boolean
      deleted_by_name:
        type: string
      group_emoji:
        type: string
      group_id:
        type: integer
      group_name:
        type: string
      id:
        description: |-
          ID is the underlying expense's or settlement's id (whichever Type/
          ParentType says this event is about), for opening the same detail view
          group history rows link to. For a "comment" event this is its parent
          expense/settlement's id, not the comment's own id — several comments
          on the same expense all point to that one detail view.
        type: integer
      is_unread:
        description: |-
          IsUnread is true when this event happened after the user's
          ActivityLastSeenAt and they didn't cause it themselves — same rule
          GetUnreadActivityCount uses, computed once here so the feed can
          highlight individual rows instead of just showing a total badge.
        type: boolean
      parent_title:
        type: string
      parent_type:
        description: |-
          ParentType and ParentTitle are set only for "comment" events: which
          kind of thing (and its title/description) the comment was left on, so
          the feed can render "commented on <ParentTitle>".
        type: string
      title:
        description: |-
          Title is the expense's description, the "X paid Y" line for a
          settlement, or the comment's own text for a comment event.
        type: string
      type:
        description: '"expense" | "settlement" | "comment"'
        type: string
      your_share:
        description: cents — 0 for comments
        type: integer
    type: object
  domain.Comment:
    properties:
      body:
        type: string
      created_at:
        type: string
      expense_id:
        type: integer
      id:
        type: integer
      settlement_id:
        type: integer
      updated_at:
        type: string
      user:
        $ref: '#/definitions/domain.User'
      user_id:
        type: integer
    type: object
  domain.Debt:
    properties:
      amount:
        description: cents
        type: integer
      from_user_id:
        type: integer
      to_user_id:
        type: integer
    type: object
  domain.Expense:
    properties:
      amount:
        description: cents
        type: integer
      category:
        description: |-
          Category is one of ExpenseCategorySlugs; it drives the expense's icon
          and grouping in the frontend.
        type: string
      created_at:
        type: string
      deleted_at:
        description: |-
          A deleted expense is excluded from every normal query (including
          balance calculations) by GORM's default scope, but the row — and the
          fact that it existed — is kept for dispute resolution. It's exposed in
          JSON (unlike most soft-deleted rows in this codebase) so the group's
          history can show it struck through instead of just vanishing.
        type: string
      deleted_by:
        $ref: '#/definitions/domain.User'
      description:
        type: string
      group_id:
        type: integer
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/domain.ExpenseItem'
        type: array
      paid_by:
        allOf:
        - $ref: '#/definitions/domain.User'
        description: Relationships
      paid_by_id:
        type: integer
      receipt_image_url:
        type: string
      splits:
        items:
          $ref: '#/definitions/domain.ExpenseSplit'
        type: array
      updated_at:
        type: string
    type: object
  domain.ExpenseItem:
    properties:
      amount:
        description: cents
        type: integer
      description:
        type: string
      expense_id:
        type: integer
      id:
        type: integer
      users:
        description: Members this item is split among (equally).
        items:
          $ref: '#/definitions/domain.User'
        type: array
    type: object
  domain.ExpenseSplit:
    properties:
      amount:
        description: cents
        type: integer
      created_at:
        type: string
      expense_id:
        type: integer
      id:
        type: integer
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/domain.User'
        description: Relationships
      user_id:
        type: integer
    type: object
  domain.Group:
    properties:
      created_at:
        type: string
      created_by:
        type: integer
      currency:
        description: |-
          Currency is the ISO 4217 code (one of CurrencyCodes) every expense and
          settlement in this group is denominated in. Fixed at creation — there's
          no conversion, so changing it later would silently misinterpret every
          amount already recorded.
        type: string
      emoji:
        type: string
      expenses:
        items:
          $ref: '#/definitions/domain.Expense'
        type: array
      id:
        type: integer
      members:
        description: Relationships
        items:
          $ref: '#/definitions/domain.User'
        type: array
      name:
        type: string
      updated_at:
        type: string
    type: object
  domain.GroupPreview:
    properties:
      created_by_name:
        type: string
      currency:
        type: string
      emoji:
        type: string
      member_count:
        type: integer
      name:
        type: string
    type: object
  domain.GroupSummary:
    properties:
      created_by:
        description: |-
          CreatedBy lets the frontend show a delete affordance only to the
          group's creator.
        type: integer
      currency:
        type: string
      emoji:
        type: string
      id:
        type: integer
      members_count:
        type: integer
      name:
        type: string
      your_balance:
        description: cents
        type: integer
    type: object
  domain.HomeSummary:
    properties:
      groups:
        items:
          $ref: '#/definitions/domain.GroupSummary'
        type: array
      overall_by_currency:
        items:
          $ref: '#/definitions/domain.OverallBalance'
        type: array
    type: object
  domain.ImportPreview:
    properties:
      currency_mismatch:
        description: |-
          CurrencyMismatch is set to the CSV's own currency when every row was
          skipped for being in a different currency than the group's (e.g.
          importing an ARS-denominated Splitwise export into a USD group) —
          otherwise the CSV looks empty or corrupt with no indication why.
          Empty whenever at least one row matched, or rows were skipped for
          other reasons.
        type: string
      member_columns:
        items:
          type: string
        type: array
      rows:
        items:
          $ref: '#/definitions/domain.ImportRow'
        type: array
      skipped_rows:
        type: integer
    type: object
  domain.ImportRow:
    properties:
      amount_cents:
        type: integer
      category:
        type: string
      date:
        type: string
      description:
        type: string
      member_nets:
        additionalProperties:
          format: int64
          type: integer
        type: object
    type: object
  domain.OverallBalance:
    properties:
      currency:
        type: string
      net:
        description: cents
        type: integer
      owe:
        description: cents
        type: integer
      owed:
        description: cents
        type: integer
    type: object
  domain.ReceiptItem:
    properties:
      description:
        type: string
      price:
        type: number
    type: object
  domain.ReceiptScan:
    properties:
      category:
        description: |-
          Category is the model's suggested expense category — always one of
          ExpenseCategorySlugs (coerced to the default when the model returns
          anything else). The user can still change it before saving.
        type: string
      date:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.ReceiptItem'
        type: array
      merchant_name:
        type: string
      receipt_image_path:
        description: |-
          ReceiptImagePath is set by our own code after uploading the scanned
          image to storage (never comes from the model's response) — the
          frontend threads it through to the expense it creates from this scan,
          so the image can be viewed/downloaded later.
        type: string
      total_amount:
        type: number
    type: object
  domain.Settlement:
    properties:
      amount:
        description: cents
        type: integer
      created_at:
        type: string
      from_user:
        allOf:
        - $ref: '#/definitions/domain.User'
        description: Relationships
      from_user_id:
        type: integer
      group_id:
        type: integer
      id:
        type: integer
      to_user:
        $ref: '#/definitions/domain.User'
      to_user_id:
        type: integer
    type: object
  domain.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      default_currency:
        description: |-
          DefaultCurrency seeds the currency field when this user creates a new
          group — best-effort guessed from their Google account locale at
          login (see auth_service.go's currencyFromLocale), never validated
          against anything the user does afterward.
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      push_comments_enabled:
        type: boolean
      push_enabled:
        description: |-
          PushEnabled is the master switch — checked before sending any push
          notification, separate from whether they have any subscribed devices
          (PushSubscription rows). The three category flags below only matter
          while this is also true; they let a user keep push on but tune which
          kinds of group activity actually notify them.
        type: boolean
      push_expenses_enabled:
        type: boolean
      push_payments_enabled:
        type: boolean
      updated_at:
        type: string
    type: object
  handler.AddCommentRequest:
    properties:
      body:
        example: Can we split this differently?
        type: string
    type: object
  handler.AddExpenseRequest:
    properties:
      amount:
        example: 12050
        type: integer
      category:
        example: food
        type: string
      description:
        example: Dinner
        type: string
      group_id:
        example: 1
        type: integer
      items:
        items:
          $ref: '#/definitions/handler.ItemInputRequest'
        type: array
      paid_by_id:
        example: 1
        type: integer
      receipt_image_path:
        description: |-
          ReceiptImagePath, if set, is the storage path returned by a prior
          POST /receipts/scan call — carries the scanned image over to the
          expense it was scanned for.
        type: string
      split_method:
        enum:
        - equal
        - percentage
        - fixed
        - shares
        example: equal
        type: string
      splits:
        items:
          $ref: '#/definitions/handler.SplitInputRequest'
        type: array
    type: object
  handler.CreateGroupRequest:
    properties:
      currency:
        example: USD
        type: string
      emoji:
        example: "\U0001F3D4️"
        type: string
      name:
        example: Trip to Paris
        type: string
    type: object
  handler.ImportRequest:
    properties:
      member_mapping:
        additionalProperties:
          type: integer
        description: |-
          MemberMapping maps a CSV member-column name (from the preview's
          member_columns) to the group member's user ID it corresponds to.
        type: object
      rows:
        items:
          $ref: '#/definitions/domain.ImportRow'
        type: array
    type: object
  handler.ImportResponse:
    properties:
      failed:
        type: integer
      imported:
        type: integer
    type: object
  handler.InviteResponse:
    properties:
      token:
        type: string
      url:
        type: string
    type: object
  handler.ItemInputRequest:
    properties:
      amount:
        example: 1500
        type: integer
      description:
        example: Burger
        type: string
      user_ids:
        items:
          type: integer
        type: array
    type: object
  handler.JoinGroupRequest:
    properties:
      token:
        example: a1b2c3d4...
        type: string
    type: object
  handler.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  handler.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  handler.SetPushPreferenceRequest:
    properties:
      push_comments_enabled:
        example: true
        type: boolean
      push_enabled:
        example: true
        type: boolean
      push_expenses_enabled:
        example: true
        type: boolean
      push_payments_enabled:
        example: true
        type: boolean
    type: object
  handler.SettleDebtRequest:
    properties:
      amount:
        example: 5000
        type: integer
      from_user_id:
        example: 2
        type: integer
      to_user_id:
        example: 1
        type: integer
    type: object
  handler.SplitInputRequest:
    properties:
      user_id:
        example: 2
        type: integer
      value:
        example: 50
        type: number
    type: object
  handler.SubscribeRequest:
    properties:
      auth:
        type: string
      endpoint:
        example: https://fcm.googleapis.com/fcm/send/...
        type: string
      p256dh:
        type: string
    type: object
  handler.TokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  handler.UnreadActivityResponse:
    properties:
      count:
        type: integer
    type: object
  handler.UnsubscribeRequest:
    properties:
      endpoint:
        example: https://fcm.googleapis.com/fcm/send/...
        type: string
    type: object
  handler.UpdateExpenseRequest:
    properties:
      amount:
        example: 12050
        type: integer
      category:
        example: food
        type: string
      description:
        example: Dinner
        type: string
      items:
        items:
          $ref: '#/definitions/handler.ItemInputRequest'
        type: array
      paid_by_id:
        example: 1
        type: integer
      receipt_image_path:
        description: |-
          ReceiptImagePath: omit the field to leave the expense's existing image
          (if any) untouched; include it (even as "") to replace it.
        type: string
      split_method:
        enum:
        - equal
        - percentage
        - fixed
        - shares
        example: equal
        type: string
      splits:
        items:
          $ref: '#/definitions/handler.SplitInputRequest'
        type: array
    type: object
  handler.UpdateGroupRequest:
    properties:
      emoji:
        example: "\U0001F3D4️"
        type: string
      name:
        example: Trip to Paris
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API server for SplitEasy app (Splitwise style expense sharing).
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: SplitEasy API
  version: "1.0"
paths:
  /activity:
    get:
      description: Returns recent expenses, settlements and comments across the user's
        groups, newest first. With q set, searches the user's full history by title
        instead of just the most recent events.
      parameters:
      - description: Search text, matched case-insensitively against each event's
          title
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.ActivityEvent'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Activity feed
      tags:
      - summary
  /activity/seen:
    post:
      description: Records that the user has viewed the activity feed as of now, clearing
        the unread badge.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Mark activity as seen
      tags:
      - summary
  /activity/unread-count:
    get:
      description: Counts activity events (expenses, settlements, comments) since
        the user last viewed the activity feed, excluding events the user caused themselves
        — for the tab bar badge.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UnreadActivityResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Unread activity count
      tags:
      - summary
  /auth/google/callback:
    get:
      description: Handles the callback from Google OAuth2, exchanges authorization
        code for a session, then redirects to the frontend with the access and refresh
        tokens in the URL fragment (#access_token=...&refresh_token=...). The fragment
        is never sent to the frontend server, so neither token appears in access logs,
        CDN logs, or Referer headers.
      parameters:
      - description: OAuth state validation
        in: query
        name: state
        required: true
        type: string
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      responses:
        "307":
          description: Temporary Redirect to FRONTEND_REDIRECT_URL#access_token=...&refresh_token=...
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Handle Google Login Callback
      tags:
      - auth
  /auth/google/login:
    get:
      description: Redirects client to Google OAuth2 consent page.
      responses:
        "307":
          description: Temporary Redirect to Google OAuth
      summary: Redirect to Google Login URL
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes a refresh token so it can no longer be exchanged for a
        new session. Doesn't require a valid access token — a client whose access
        token has already expired still needs to be able to revoke its refresh token.
      parameters:
      - description: Refresh token to revoke
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LogoutRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Log out
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a valid, unused refresh token for a new access token
        and a new refresh token (the old refresh token stops working, whether or not
        this call succeeds).
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Refresh a session
      tags:
      - auth
  /comments/{id}:
    delete:
      description: Soft-deletes a comment. Only its author may delete it.
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Delete a comment
      tags:
      - comments
  /expenses:
    post:
      consumes:
      - application/json
      description: Adds a new expense to a group and splits it. split_method can be
        "equal" (default; splits among all members, or the given subset), "percentage"
        (splits values must add up to 100), "fixed" (splits values must add up to
        amount), or "shares" (splits proportionally to relative weights).
      parameters:
      - description: Expense Info
        in: body
        name: expense
        required: true
        schema:
          $ref: '#/definitions/handler.AddExpenseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Expense'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Add an expense
      tags:
      - expenses
  /expenses/{id}:
    delete:
      description: Soft-deletes an expense. Only the payer or a split participant
        may delete it.
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Delete an expense
      tags:
      - expenses
    get:
      description: Retrieves a single expense by id. Any member of the expense's group
        may view it — unlike edit/delete, this isn't limited to the payer or split
        participants.
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Expense'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Get an expense
      tags:
      - expenses
    put:
      consumes:
      - application/json
      description: Replaces an expense's payer, description, amount, split, and items.
        Only the current payer or a current split participant may edit it.
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated expense info
        in: body
        name: expense
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateExpenseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Expense'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - JWT: []
      summary: Edit an expense
      tags:
      - expenses
  /expenses/{id}/comments:
    get:
      description: Returns every comment on an expense, oldest first. Any member of
        the expense's group may view them.
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Comment'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: List an expense's comments
      tags:
      - comments
    post:
      consumes:
      - application/json
      description: Adds a comment to an expense. Any member of the expense's group
        may comment.
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        type: integer
      - description: Comment body
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/handler.AddCommentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Comment'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Comment on an expense
      tags:
      - comments
  /groups:
    get:
      description: Retrieves all groups the authenticated user is a member of.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Group'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: List groups for the authenticated user
      tags:
      - groups
    post:
      consumes:
      - application/json
      description: Creates a new group for sharing expenses. The authenticated user
        becomes its creator and first member.
      parameters:
      - description: Group Info
        in: body
        name: group
        required: true
        schema:
          $ref: '#/definitions/handler.CreateGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Group'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Create a group
      tags:
      - groups
  /groups/{groupId}/expenses:
    get:
      description: Retrieves list of expenses for a specific group.
      parameters:
      - description: Group ID
        in: path
        name: groupId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Expense'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Get expenses of a group
      tags:
      - expenses
  /groups/{id}:
    delete:
      description: Permanently deletes the group and everything under it — every expense,
        settlement, and comment, plus their receipt images. Only the group's creator
        may do this. Irreversible.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Delete a group
      tags:
      - groups
    get:
      description: Retrieves a group by ID.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Group'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - JWT: []
      summary: Get a group
      tags:
      - groups
    patch:
      consumes:
      - application/json
      description: Updates the group's name and/or emoji. Any member may call this
        — unlike deleting a group, renaming or re-iconing it isn't destructive. Fields
        omitted from the request body are left unchanged.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: group
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Group'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - JWT: []
      summary: Update a group's name and/or icon
      tags:
      - groups
  /groups/{id}/balances:
    get:
      description: Calculates the debts within a group to settle accounts.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Debt'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Get balances/debts of a group
      tags:
      - groups
  /groups/{id}/export.csv:
    get:
      description: Downloads every expense and settlement in the group as a CSV in
        the same column shape Splitwise's own export uses — opens directly in Splitwise,
        or back into this app via the CSV import above.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - JWT: []
      summary: Export a group's history as a Splitwise-compatible CSV
      tags:
      - groups
  /groups/{id}/import:
    post:
      consumes:
      - application/json
      description: Creates one expense per row using memberMapping to resolve each
        row's payer and splits, preserving the original dates. Only allowed on a group
        with no expenses or settlements yet — this is a one-time history migration,
        not an ongoing sync.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      - description: Parsed rows and column-to-member mapping
        in: body
        name: import
        required: true
        schema:
          $ref: '#/definitions/handler.ImportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ImportResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - JWT: []
      summary: Import expenses from a previously-parsed CSV
      tags:
      - groups
  /groups/{id}/import/preview:
    post:
      consumes:
      - multipart/form-data
      description: Parses an uploaded CSV (e.g. a Splitwise export) into a preview
        — detected member columns and structured rows — without creating anything.
        The frontend uses this to let the user map each column to a real group member
        before confirming.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      - description: Expense history CSV
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ImportPreview'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - JWT: []
      summary: Preview a Splitwise-style expense CSV import
      tags:
      - groups
  /groups/{id}/invite:
    get:
      description: Returns the share token and a join link for the group. Only group
        members can request it.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.InviteResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Get a group's invite link
      tags:
      - groups
  /groups/{id}/settlements:
    get:
      description: Returns every recorded payment in the group for the unified history
        view.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Settlement'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: List a group's settlements
      tags:
      - groups
    post:
      consumes:
      - application/json
      description: Records a payment between two group members, reducing their outstanding
        balance.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      - description: Settlement Info
        in: body
        name: settlement
        required: true
        schema:
          $ref: '#/definitions/handler.SettleDebtRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Settlement'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Settle a debt
      tags:
      - groups
  /groups/join:
    post:
      consumes:
      - application/json
      description: Adds the authenticated user to the group identified by the invite
        token. Idempotent.
      parameters:
      - description: Invite token
        in: body
        name: invite
        required: true
        schema:
          $ref: '#/definitions/handler.JoinGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Group'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - JWT: []
      summary: Join a group via invite token
      tags:
      - groups
  /groups/preview:
    get:
      description: Returns the limited, non-member info an invite link points to (name,
        emoji, currency, member count) so the app can show a "join this group?" confirmation
        before actually joining. No authentication required — the invite token is
        the only credential needed, same as JoinGroup, and this returns strictly less
        than joining would expose.
      parameters:
      - description: Invite token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.GroupPreview'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Preview a group by invite token
      tags:
      - groups
  /home:
    get:
      description: Returns the authenticated user's overall balance and per-group
        net balances.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HomeSummary'
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Home summary
      tags:
      - summary
  /push/subscribe:
    delete:
      consumes:
      - application/json
      description: Removes this browser/device's push subscription (e.g. when the
        user disables push and wants the device forgotten).
      parameters:
      - description: Endpoint to remove
        in: body
        name: subscription
        required: true
        schema:
          $ref: '#/definitions/handler.UnsubscribeRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Remove a push subscription
      tags:
      - push
    post:
      consumes:
      - application/json
      description: Registers (or re-registers) this browser/device for push notifications.
        Each user can have up to 10 subscriptions.
      parameters:
      - description: Push subscription
        in: body
        name: subscription
        required: true
        schema:
          $ref: '#/definitions/handler.SubscribeRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - JWT: []
      summary: Register a push subscription
      tags:
      - push
  /receipts/scan:
    post:
      consumes:
      - multipart/form-data
      description: Parses a photographed or scanned receipt/ticket/invoice using AI
        and returns the extracted merchant, date, total and line items, for prefilling
        a new expense. Accepts both images and PDFs.
      parameters:
      - description: Receipt file (jpeg, png, webp, gif or pdf)
        in: formData
        name: image
        required: true
        type: file
      - description: The scanning group's currency (ISO 4217) — tells the model which
          decimal/thousands-separator convention to expect. Defaults to the app's
          default currency if omitted.
        in: formData
        name: currency
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ReceiptScan'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "429":
          description: Too Many Requests
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
        "503":
          description: Service Unavailable
          schema:
            type: string
      security:
      - JWT: []
      summary: Scan a receipt image or PDF
      tags:
      - expenses
  /settlements/{id}:
    delete:
      description: Soft-deletes a recorded payment. Only the settlement's from_user_id
        or to_user_id may delete it — not just any group member.
      parameters:
      - description: Settlement ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Delete a settlement
      tags:
      - groups
    get:
      description: Retrieves a single settlement by id. Any member of the settlement's
        group may view it — unlike delete, this isn't limited to the two parties.
      parameters:
      - description: Settlement ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Settlement'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Get a settlement
      tags:
      - groups
  /settlements/{id}/comments:
    get:
      description: Returns every comment on a settlement, oldest first. Any member
        of the settlement's group may view them.
      parameters:
      - description: Settlement ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Comment'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: List a settlement's comments
      tags:
      - comments
    post:
      consumes:
      - application/json
      description: Adds a comment to a settlement. Any member of the settlement's
        group may comment.
      parameters:
      - description: Settlement ID
        in: path
        name: id
        required: true
        type: integer
      - description: Comment body
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/handler.AddCommentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Comment'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Comment on a settlement
      tags:
      - comments
  /users/me:
    get:
      description: Returns the profile of the currently authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - JWT: []
      summary: Get the authenticated user
      tags:
      - users
  /users/me/push-preference:
    patch:
      consumes:
      - application/json
      description: Sets the master push switch plus which categories of group activity
        (expenses, payments, comments) notify the authenticated user. Doesn't touch
        existing device subscriptions — disabling just stops sends, so re-enabling
        later doesn't need the browser permission prompt again. The client always
        sends its full current state.
      parameters:
      - description: Push preference
        in: body
        name: preference
        required: true
        schema:
          $ref: '#/definitions/handler.SetPushPreferenceRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - JWT: []
      summary: Set push notification preferences
      tags:
      - users
securityDefinitions:
  JWT:
    description: Type "Bearer <your-jwt-token>" to authenticate.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
